[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilemap-editor"
version = "4.3.1"
description = "Pygame tilemap editor with collision, animation, sprite & particle tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "tilemap editor contributors" }]
dependencies = [
  "pygame-ce>=2.5",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development",
]

[project.scripts]
tilemap-editor = "tilemap_editor.cli:main"
tilemap-anim-editor = "plugins.sprite_animation.standalone:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
py-modules = [
  "constants",
  "editor",
  "event_map",
  "layers",
  "node_manager",
  "nodes",
  "tilemap",
  "standalone_filemanager",
  "standalone_image_viewer",
  "standalone_automap",
  "standalone_error_console",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "tilemap_editor*",
  "plugins*",
  "ttypes*",
  "widgets*",
  "utils*",
  "configs*",
]
namespaces = true

[tool.setuptools.package-data]
"tilemap_editor.assets" = [
  "icons/*.svg",
  "fonts/noto/*.ttf",
  "fonts/jetbrain-fonts/*.ttf"
]

[tool.setuptools.exclude-package-data]
"*" = ["*.spec", "*.sh"]

# Keep data-files for backward compatibility (one release cycle)
[tool.setuptools.data-files]
"share/tilemap_editor/assets/icons" = ["assets/icons/*.svg"]
"share/tilemap_editor/assets/fonts/noto" = ["assets/fonts/noto/*.ttf"]
"share/tilemap_editor/assets/fonts/jetbrain-fonts" = ["assets/fonts/jetbrain-fonts/*.ttf"]
