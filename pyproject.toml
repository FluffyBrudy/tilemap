[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilemap-editor"
version = "5.3.0"
description = "Pygame tilemap editor with collision, animation, sprite & particle tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tilemap editor contributors" }]
dependencies = [
  "pygame-ce>=2.5",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development",
]

[project.scripts]
tilemap-editor = "tilemap_editor.cli:main"
tilemap-anim-editor = "plugins.sprite_animation.standalone:main"
tilemap-particle-editor = "plugins.particle_editor.standalone:main"

[project.optional-dependencies]
dev = ["towncrier"]

[tool.towncrier]
package = "tilemap_editor"
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->"
underlines = ["-", "~", "^"]

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
py-modules = [
  "aliases",
  "constants",
  "editor",
  "event_map",
  "layers",
  "node_manager",
  "nodes",
  "tilemap",
  "standalone_filemanager",
  "standalone_image_viewer",
  "standalone_automap",
  "standalone_error_console",
  "standalone_marker_palette",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "tilemap_editor*",
  "plugins*",
  "ttypes*",
  "widgets*",
  "utils*",
  "configs*",
]
namespaces = true

[tool.setuptools.package-data]
"tilemap_editor.assets" = [
  "icons/*.svg",
  "fonts/noto/*.ttf",
  "fonts/jetbrain-fonts/*.ttf"
]
"plugins.particle_editor" = [
  "*.particles.json",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.spec", "*.sh"]

[tool.pytest.ini_options]
markers = [
    "unit: fast functional unit and integration tests",
    "e2e: whole-flow UI interaction tests (fake editors, synthetic events)",
]
