name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyinstaller pygame-ce
      - name: Build with PyInstaller
        run: pyinstaller tilemap_editor.spec
      - name: Package macOS .app
        if: matrix.os == 'macos-latest'
        run: cd dist && zip -r "../TilemapEditor-macos.zip" "TilemapEditor.app"
      - name: Package Linux binary
        if: matrix.os == 'ubuntu-latest'
        run: cd dist && zip -r "../TilemapEditor-linux.zip" "TilemapEditor"
      - name: Package Windows binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "dist\TilemapEditor" -DestinationPath "TilemapEditor-windows.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: TilemapEditor-*.zip
