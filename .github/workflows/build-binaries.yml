name: Build binaries

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyinstaller pygame-ce
      - name: Build with PyInstaller
        run: pyinstaller tilemap_editor.spec
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/TilemapEditor/**
