target-version = "py311"
line-length = 88

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PIE",
    "RET",
    "SIM",
    "ASYNC",
]

ignore = [
    "E501",
    "E203",
    "SIM105",
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["F401", "F811"]

[lint.isort]
known-first-party = ["tilemap_editor"]
